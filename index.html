<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Bakery</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-topbar">
                <div class="topbar-info">
                    <span class="email">Hello@colorlib.com</span>
                    <span class="stick">|</span>
                    <span class="freepromo">Free Shipping for all order of $99</span>
                </div>
                <div class="topbar-socials">
                    <a href="#">FaceBook</a>
                    <a href="#">Viber</a>
                    <a href="#">Instagram</a>
                    <a href="#">Twitter</a>
                </div>
            </div>



            <div class="header-midbar">
                <div class="logo">
                    <a href="#">
                        <img src="img/logo.img" alt="Русская пекарня">
                        <span class="logo-text">РУССКАЯ<br>ПЕКАРНЯ</span>
                    </a>
                </div>

                <div class="search-box">
                    <form action="#">
                        <input type="text" placeholder="Что вы ищите?">
                    </form>
                </div>

                <div class="phone-number">
                    <img src="img/phone.img" alt="1800-000-101">
                </div>

                <div class="profile">
                    <img src="img/profile-icon.img" alt="You">
                </div>
            </div>
            
            
            
            <div class="header-downbar">
                <div class="categories-choice">
                    <img src="img/categories.img" alt="три полоски">
                    <a href="#">Select Categories</a>
                </div>

                <div class="buttons">
                    <span><a href="#">HOME</a></span>
                    <span><a href="#">PRODUCT</a></span>
                    <span><a href="#">STORES</a></span>
                    <span><a href="#">CONTACT</a></span>
                </div>

                <div class="cart">
                    <img src="img/cart-logo" alt="cart-icon">
                    <span>1337</span>
                </div>
            </div>
        </header>



        <main>
            Основа
        </main>



        <footer>
            Подвал
        </footer>
    </div>
</body>
</html>
